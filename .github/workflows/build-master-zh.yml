name: build-master-zh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build master-zh (${{ matrix.profile }})
    runs-on: windows-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          # 标准 release：编译快，推荐
          - profile: release
            release_tag: v0.2026.10.22.zh_06
            artifact: warp-zh-master
          # thin-LTO：编译慢，运行略快
          - profile: rlto
            release_tag: v0.2026.10.22.zh_06-lto
            artifact: warp-zh-master-lto
    env:
      GIT_RELEASE_TAG: ${{ matrix.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          ref: master-zh

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          swap-storage: false

      - name: Install protoc
        shell: pwsh
        run: choco install protoc -y --no-progress

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup show
          rustc --version

      - name: Build warp-oss
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_FULL_PROFILE: ${{ matrix.profile }}
          RUSTFLAGS: -C debuginfo=0
          CARGO_NET_RETRY: 5
        run: |
          cargo build --profile ${{ matrix.profile }} -p warp --bin warp-oss \
            --features gui,release_bundle

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory dist | Out-Null
          $rel = 'target\${{ matrix.profile }}'
          if (-not (Test-Path $rel)) { throw "build output not found: $rel" }
          Get-ChildItem $rel -File | Where-Object { $_.Extension -in '.exe','.dll' } | Copy-Item -Destination dist\
          if (Test-Path "$rel\x64") { Copy-Item "$rel\x64" dist\x64 -Recurse }

          New-Item -ItemType Directory dist\resources -Force | Out-Null
          if (Test-Path 'resources\i18n') {
            Copy-Item 'resources\i18n' dist\resources\i18n -Recurse -Force
          }
          if (Test-Path 'resources\bundled') {
            Copy-Item 'resources\bundled' dist\resources\bundled -Recurse -Force
          }
          if (Test-Path 'resources\channel-gated-skills') {
            Copy-Item 'resources\channel-gated-skills' dist\resources\channel-gated-skills -Recurse -Force
          }
          $metaDir = 'dist\resources\bundled\metadata'
          New-Item -ItemType Directory $metaDir -Force | Out-Null
          @{ warp_version = $env:GIT_RELEASE_TAG } | ConvertTo-Json |
            Set-Content -Path (Join-Path $metaDir 'version.json') -Encoding utf8

          $exe = Get-Item 'dist\warp-oss.exe'
          Write-Host ('exe version: ' + $exe.VersionInfo.FileVersion)
          Write-Host ('exe size   : {0:N2} MB' -f ($exe.Length / 1MB))
          Compress-Archive -Path dist\* -DestinationPath '${{ matrix.artifact }}.zip' -Force
          Write-Host ('zip size   : {0:N2} MB' -f ((Get-Item '${{ matrix.artifact }}.zip').Length / 1MB))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14
