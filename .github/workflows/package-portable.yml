name: package-portable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to package (e.g. v0.2026.5.13.zh_03)'
        required: true
        default: 'v0.2026.5.13.zh_03'

permissions:
  contents: read

jobs:
  portable:
    name: Build Portable installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Download release payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ inputs.release_tag }}'
          New-Item -ItemType Directory -Force payload | Out-Null
          gh release download $tag --repo ${{ github.repository }} -p 'warp-zh-win64.zip' -D payload
          Expand-Archive -Path 'payload\warp-zh-win64.zip' -DestinationPath payload\app -Force
          Remove-Item 'payload\warp-zh-win64.zip' -Force
          # Inno 的 Source 是 payload\*，所以把解出来的内容平铺到 payload 根
          Move-Item payload\app\* payload\ -Force
          Remove-Item payload\app -Recurse -Force
          Get-ChildItem payload -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }
          & $iscc 'installer\portable.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem . -Filter '*.exe' | Where-Object { $_.Name -like 'Warp*' } |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: portable-installer
          path: Output/*.exe
          if-no-files-found: error
          retention-days: 14
