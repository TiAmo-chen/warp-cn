name: package-portable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag that holds the payload zip'
        required: true
        default: 'v0.2026.5.13.zh_03'
      asset_name:
        description: 'Payload zip asset name'
        required: true
        default: 'warp-zh-win64.zip'
      output_name:
        description: 'Output installer base name (no extension)'
        required: true
        default: 'Warp-zh-Portable'

permissions:
  contents: read

jobs:
  portable:
    name: Build Portable installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Download release payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force payload | Out-Null
          gh release download '${{ inputs.release_tag }}' --repo ${{ github.repository }} -p '${{ inputs.asset_name }}' -D payload
          $zip = Get-ChildItem payload -Filter *.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath payload\app -Force
          Remove-Item $zip.FullName -Force
          Move-Item payload\app\* payload\ -Force
          Remove-Item payload\app -Recurse -Force
          Get-ChildItem payload -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }
          & $iscc "/O$PWD\Output" /DMyOutputName='${{ inputs.output_name }}' 'installer\portable.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem "$PWD\Output" -Filter '*.exe' |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: portable-installer
          path: Output/*.exe
          if-no-files-found: error
          retention-days: 14
