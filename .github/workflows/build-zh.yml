name: build-warp-zh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Warp zh-CN (${{ matrix.profile }})
    runs-on: windows-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          # 标准 release：编译快（~40 分钟），体积略大
          - profile: release
            release_tag: v0.2026.5.13.zh_03
            artifact: warp-zh-win64
          # thin-LTO：编译慢（~60-80 分钟），二进制更小、运行更快
          - profile: rlto
            release_tag: v0.2026.5.13.zh_03-lto
            artifact: warp-zh-win64-lto
    env:
      # 被 option_env!("GIT_RELEASE_TAG") 编进二进制和 exe 版本资源
      GIT_RELEASE_TAG: ${{ matrix.release_tag }}
    steps:
      # NOTE: LFS objects are missing on this fork (git lfs fetch returns 404),
      # so LFS is disabled. The only LFS payloads are *.pdb and the optional
      # ONNX models behind the non-default `onnx` feature, neither of which the
      # GUI build needs.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Show environment
        shell: bash
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH"
          echo "profile: ${{ matrix.profile }}"
          echo "release tag: $GIT_RELEASE_TAG"
          df -h / 2>/dev/null || true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          swap-storage: false

      - name: Install protoc
        shell: pwsh
        run: choco install protoc -y --no-progress

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup show
          rustc --version
          cargo --version

      # command-signatures-v2/build.rs shells out to `yarn build`. Yarn 4 is not
      # preinstalled, and if js/build is missing the build script panics.
      - name: Prepare command-signatures JS
        shell: bash
        run: |
          set -x
          cd crates/command-signatures-v2/js
          corepack enable || true
          if command -v yarn >/dev/null 2>&1; then
            yarn install || true
            yarn build || true
          fi
          if [ ! -d build ]; then
            npm install --no-audit --no-fund
            npx tsc -p tsconfig.json
          fi
          ls -la build | head -20

      - name: Build warp-oss
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # app/build.rs 用它推导 <workspace>/target/<profile>
          CARGO_FULL_PROFILE: ${{ matrix.profile }}
          RUSTFLAGS: -C debuginfo=0
          CARGO_NET_RETRY: 5
        run: |
          cargo build --profile ${{ matrix.profile }} -p warp --bin warp-oss \
            --features oss-default,gui,release_bundle

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory dist | Out-Null
          $rel = 'target\${{ matrix.profile }}'
          if (-not (Test-Path $rel)) { throw "build output not found: $rel" }
          Get-ChildItem $rel -File | Where-Object { $_.Extension -in '.exe','.dll' } | Copy-Item -Destination dist\
          if (Test-Path "$rel\x64") { Copy-Item "$rel\x64" dist\x64 -Recurse }

          New-Item -ItemType Directory dist\resources -Force | Out-Null

          # 汉化资源：运行时从 exe 同级的 resources\i18n 加载，必须一起打包
          if (Test-Path 'resources\i18n') {
            Copy-Item 'resources\i18n' dist\resources\i18n -Recurse -Force
          } else {
            throw 'resources\i18n not found - 汉化资源缺失，拒绝出包'
          }

          if (Test-Path 'resources\bundled') {
            Copy-Item 'resources\bundled' dist\resources\bundled -Recurse -Force
          }

          $metaDir = 'dist\resources\bundled\metadata'
          New-Item -ItemType Directory $metaDir -Force | Out-Null
          @{ warp_version = $env:GIT_RELEASE_TAG } |
            ConvertTo-Json |
            Set-Content -Path (Join-Path $metaDir 'version.json') -Encoding utf8

          $exe = Get-Item 'dist\warp-oss.exe'
          Write-Host ('exe version: ' + $exe.VersionInfo.FileVersion)
          Write-Host ('exe size   : {0:N2} MB' -f ($exe.Length / 1MB))

          Compress-Archive -Path dist\* -DestinationPath '${{ matrix.artifact }}.zip' -Force
          Write-Host ('zip size   : {0:N2} MB' -f ((Get-Item '${{ matrix.artifact }}.zip').Length / 1MB))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14
