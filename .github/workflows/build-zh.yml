name: build-warp-zh

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Baked into the binary via option_env!("GIT_RELEASE_TAG") in
  # crates/warp_core/src/channel/state.rs and app/build.rs. Without it the UI
  # and the exe version resource both render as "v#.##.###".
  # Format follows upstream tags: v<year>.<month>.<day>.<...>
  GIT_RELEASE_TAG: v0.2026.5.13.zh_01

jobs:
  build:
    name: Build Warp zh-CN (windows)
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      # NOTE: LFS objects are missing on this fork (git lfs fetch returns 404),
      # so LFS is disabled. The only LFS payloads are *.pdb and the optional
      # ONNX models behind the non-default `onnx` feature, neither of which the
      # GUI build needs.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Show environment
        shell: bash
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH"
          echo "version tag: $GIT_RELEASE_TAG"
          df -h / 2>/dev/null || true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          swap-storage: false

      - name: Install protoc
        shell: pwsh
        run: choco install protoc -y --no-progress

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Build warp-oss
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TARGET_DIR: D:/t
          RUSTFLAGS: -C debuginfo=0
        run: |
          cargo build --profile release -p warp --bin warp-oss --features oss-default,gui

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory dist | Out-Null
          $rel = 'D:\t\release'
          Get-ChildItem $rel -File | Where-Object { $_.Extension -in '.exe','.dll' } | Copy-Item -Destination dist\
          if (Test-Path "$rel\x64") { Copy-Item "$rel\x64" dist\x64 -Recurse }

          New-Item -ItemType Directory dist\resources -Force | Out-Null

          # 汉化资源：运行时从 exe 同级的 resources\i18n 加载，必须一起打包
          if (Test-Path 'resources\i18n') {
            Copy-Item 'resources\i18n' dist\resources\i18n -Recurse -Force
          } else {
            throw 'resources\i18n not found'
          }

          # 内置技能等打包资源
          if (Test-Path 'resources\bundled') {
            Copy-Item 'resources\bundled' dist\resources\bundled -Recurse -Force
          }

          # 版本元数据（内置技能/反馈脚本会读取）
          $metaDir = 'dist\resources\bundled\metadata'
          New-Item -ItemType Directory $metaDir -Force | Out-Null
          @{ warp_version = $env:GIT_RELEASE_TAG } |
            ConvertTo-Json |
            Set-Content -Path (Join-Path $metaDir 'version.json') -Encoding utf8

          Write-Host "--- version metadata ---"
          Get-Content (Join-Path $metaDir 'version.json')

          Write-Host '--- payload ---'
          Get-ChildItem dist -Recurse -File |
            Select-Object FullName, Length |
            Sort-Object FullName |
            Format-Table -AutoSize |
            Out-String |
            Write-Host

          Compress-Archive -Path dist\* -DestinationPath warp-zh-win64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-zh-win64
          path: warp-zh-win64.zip
          if-no-files-found: error
          retention-days: 14
