name: build-warp-zh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Warp zh-CN (windows)
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      # NOTE: LFS objects are missing on this fork (git lfs fetch returns 404),
      # so LFS is disabled. The only LFS payloads are *.pdb and the optional
      # ONNX models behind the non-default `onnx` feature, neither of which the
      # GUI build needs.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Show environment
        shell: bash
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH"
          df -h / 2>/dev/null || true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          swap-storage: false

      - name: Install protoc
        shell: pwsh
        run: choco install protoc -y --no-progress

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup show
          rustc --version
          cargo --version

      # command-signatures-v2/build.rs shells out to `yarn build`. Yarn 4 is not
      # preinstalled, and if js/build is missing the build script panics.
      # Pre-build the TypeScript with npm so the script's "stale output" path is
      # available, and try yarn first in case corepack works.
      - name: Prepare command-signatures JS
        shell: bash
        run: |
          set -x
          cd crates/command-signatures-v2/js
          corepack enable || true
          if command -v yarn >/dev/null 2>&1; then
            yarn install || true
            yarn build || true
          fi
          if [ ! -d build ]; then
            npm install --no-audit --no-fund
            npx tsc -p tsconfig.json
          fi
          ls -la build | head -20

      - name: Build warp-oss
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_FULL_PROFILE: release
          RUSTFLAGS: -C debuginfo=0
          CARGO_NET_RETRY: 5
        run: |
          cargo build --profile release -p warp --bin warp-oss --features oss-default,gui

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          $rel = 'target\release'
          Get-ChildItem $rel -File | Where-Object { $_.Extension -in '.exe','.dll' } | Copy-Item -Destination dist\
          if (Test-Path "$rel\x64") { Copy-Item "$rel\x64" dist\x64 -Recurse }
          if (Test-Path 'resources\i18n') {
            New-Item -ItemType Directory dist\resources -Force | Out-Null
            Copy-Item 'resources\i18n' dist\resources\i18n -Recurse
          }
          Write-Host '--- payload ---'
          Get-ChildItem dist -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
          Compress-Archive -Path dist\* -DestinationPath warp-zh-win64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-zh-win64
          path: warp-zh-win64.zip
          if-no-files-found: error
          retention-days: 14
