name: test-i18n

on:
  workflow_dispatch:
  push:
    branches:
      - master-zh
    paths:
      - 'crates/warp_i18n/**'

permissions:
  contents: read

jobs:
  test:
    name: cargo test -p warp_i18n
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          ref: master-zh

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup show
          rustc --version

      - name: Run i18n tests
        shell: bash
        env:
          RUSTFLAGS: -C debuginfo=0
        run: |
          cargo test -p warp_i18n -- --nocapture
